name: Publish JS SDK

on:
  push:
    branches:
      - main
    paths:
      - apps/js-sdk/firecrawl/package.json
  workflow_dispatch:

env:
  TEST_API_KEY: ${{ secrets.TEST_API_KEY }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: './apps/js-sdk/firecrawl/pnpm-lock.yaml'
      - name: Publish
        run: |
          pnpm install
          pnpm run build
          VERSION=$(node -p "require('./package.json').version")
          npm pkg set name=firecrawl
          npm pkg delete dependencies.firecrawl
          pnpm publish --access public --no-git-checks
          npm pkg set name=@mendable/firecrawl-js dependencies.firecrawl=$VERSION
          pnpm publish --access public --no-git-checks
          npm pkg set name=@mendable/firecrawl
          pnpm publish --access public --no-git-checks
        working-directory: ./apps/js-sdk/firecrawl
