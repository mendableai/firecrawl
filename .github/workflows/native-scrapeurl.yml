name: Native scrapeURL

on:
  pull_request:
    branches:
      - mog/scrapeurl-rust
    paths:
      - apps/api/native/**
      - .github/workflows/native-scrapeurl.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check, test and TS bindings
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: ./apps/api/native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/native/target
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('apps/api/native/Cargo.toml', 'apps/api/native/kinded-macro/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test
        env:
          HEGEL_DEFAULT_PROFILE: ci

      - name: Check TS bindings are up to date
        run: |
          pnpm ts-bindings
          git diff --exit-code
