name: Native ScrapeURL Test Suite

on:
  pull_request:
    branches:
      - mog/scrapeurl-rust
    paths:
      - apps/api/native/**
      - apps/api/pnpm-lock.yaml
      - apps/api/pnpm-workspace.yaml
      - .github/workflows/native-scrapeurl.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check, Property Test, and Bindings
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/native/target
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('apps/api/native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-

      - name: Check all targets
        working-directory: ./apps/api/native
        run: cargo check --all-targets

      - name: Run tests (Hegel CI profile)
        working-directory: ./apps/api/native
        env:
          HEGEL_PROFILE: ci
        run: cargo test

      - name: Verify TypeScript bindings
        working-directory: ./apps/api/native
        run: |
          pnpm install --ignore-scripts
          pnpm ts-bindings
          git diff --exit-code
